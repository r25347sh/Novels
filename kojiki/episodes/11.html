    <h1>神功皇后　海を越えた遠征</h1>
    <div class="ep-meta">中巻・天皇記</div>
<p>仲哀天皇の后・息長帯比売命（神功皇后）。<br>神憑りがあり「海の向こうの国を取れ」と託宣があったが、仲哀天皇は信じず、間もなく崩御したとされる。</p>
<p>神功皇后は自ら兵を率い、お腹に皇子を宿したまま新羅へ遠征。<br>帰国後に皇子を生み、それが後の応神天皇となる。</p>
<p>古事記では、この遠征を通じて大陸との関係や応神朝の起源が語られる。</p>
<div class="note"><strong>補足</strong><br>三韓遠征は日本書紀により詳しく書かれています。歴史的事実かは別として、伝承としての影響力は大きいです。</div>
