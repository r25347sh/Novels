    <h1>大国主　国作りと試練の連続</h1>
    <div class="ep-meta">上巻・神代</div>
<p>須佐之男命の子孫・<strong>大国主神</strong>（大穴牟遅神）。<br>兄弟の八十神にいじめられ、因幡の白兎を助けたことで八上比売を妻にする。</p>
<p>嫉妬した兄弟に何度も殺されるが、母神や高天原の力で復活。<br>根の堅州国で須佐之男命の娘・須勢理毘売と恋に落ち、次々と試練を乗り越える。</p>
<p>最終的に須佐之男命に認められ、大刀・弓矢と須勢理毘売を得て、葦原中国の国作りを進める。</p>
<div class="note"><strong>補足</strong><br>国作り神話の中心。出雲大社の祭神としても重要。</div>
