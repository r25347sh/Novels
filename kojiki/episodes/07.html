    <h1>国譲り　天孫へ続く道</h1>
    <div class="ep-meta">上巻・神代</div>
<p>天照大御神は「葦原中国は我が御子が治むべき地」と考える。<br>使者を送るがうまくいかず、最終的に<strong>建御雷神</strong>が派遣される。</p>
<p>大国主は子の事代主神に問い、従うことに。<br>もう一人の子・建御名方神は抵抗するが敗れ、諏訪で降伏する。</p>
<p>大国主は国を譲り、壮大な宮殿（出雲大社の起源）を条件とした。<br>天照大御神の孫・<strong>邇邇芸命</strong>が日向の高千穂に降臨する（天孫降臨）。</p>
<div class="note"><strong>補足</strong><br>国譲りは出雲と大和の関係を神話化したものと解釈されることが多い。</div>
