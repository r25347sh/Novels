<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ラノベ古事記風・日本神話 | 神代から推古まで</title>
  <meta name="description" content="古事記をベースにした完全オリジナルの現代ラノベ風再話。神社検定対策にも、娯楽としても読める。">
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <!-- サイドバー / 目次 -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <h1 class="site-title">ラノベ古事記風</h1>
        <p class="site-subtitle">日本神話・完全再話</p>
        <button id="close-sidebar" class="icon-btn" aria-label="目次を閉じる">×</button>
      </div>
      <nav id="toc" class="toc">
        <!-- JSで生成 -->
      </nav>
      <div class="sidebar-footer">
        <p class="copyright-note">
          原典：古事記（太安万侶 撰・712年）<br>
          本作品はパブリックドメインの神話を元にした<br>
          完全オリジナルの現代ラノベ風再話です。
        </p>
      </div>
    </aside>

    <!-- オーバーレイ -->
    <div id="overlay" class="overlay"></div>

    <!-- メインビューア -->
    <main id="viewer" class="viewer">
      <header class="viewer-header">
        <button id="open-sidebar" class="icon-btn" aria-label="目次を開く">☰</button>
        <div class="header-info">
          <span id="current-volume" class="volume-label"></span>
          <span id="current-title" class="episode-title-header"></span>
        </div>
        <div class="header-actions">
          <button id="settings-btn" class="icon-btn" aria-label="表示設定">ぁあ</button>
        </div>
      </header>

      <article id="episode-content" class="episode-content">
        <!-- エピソード本文がここに入る -->
        <div class="loading">読み込み中…</div>
      </article>

      <footer class="viewer-footer">
        <button id="prev-ep" class="nav-btn" disabled>← 前の話</button>
        <div class="progress-info">
          <span id="ep-position"></span>
        </div>
        <button id="next-ep" class="nav-btn">次の話 →</button>
      </footer>
    </main>

    <!-- 設定パネル -->
    <div id="settings-panel" class="settings-panel hidden">
      <div class="settings-inner">
        <h3>表示設定</h3>
        <div class="setting-group">
          <label>文字サイズ</label>
          <div class="size-btns">
            <button data-size="small">小</button>
            <button data-size="medium" class="active">中</button>
            <button data-size="large">大</button>
            <button data-size="xlarge">特大</button>
          </div>
        </div>
        <div class="setting-group">
          <label>背景</label>
          <div class="bg-btns">
            <button data-bg="light" class="active">ライト</button>
            <button data-bg="sepia">セピア</button>
            <button data-bg="dark">ダーク</button>
          </div>
        </div>
        <button id="close-settings" class="close-settings-btn">閉じる</button>
      </div>
    </div>
  </div>

  <script src="data/episodes.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
